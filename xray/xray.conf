server {
    listen 80;
    listen [::]:80;
    server_name xxxxx;

    root /home/vps/public_html;

    location ^~ /.well-known/acme-challenge/ {
        root /home/vps/public_html;
        allow all;
        default_type "text/plain";
    }

    location =/ {
        proxy_pass http://127.0.0.1:700;
        include /etc/nginx/snippets/ws_headers.conf;
    }

    location /vmess-ws {
        proxy_pass http://127.0.0.1:10087;
        include /etc/nginx/snippets/ws_headers.conf;
    }

    location /trojan-ws {
        proxy_pass http://127.0.0.1:10088;
        include /etc/nginx/snippets/ws_headers.conf;
    }

    location / {
        rewrite ^/(.*)$ / break;
        proxy_pass http://127.0.0.1:10086;
        include /etc/nginx/snippets/ws_headers.conf;
    }
}


server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xxxxx;

    ssl_certificate     /etc/xray/xray.crt;
    ssl_certificate_key /etc/xray/xray.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location /vless-grpc {
        grpc_pass grpc://127.0.0.1:10089;
        include /etc/nginx/snippets/grpc_headers.conf;
    }

    location /vmess-grpc {
        grpc_pass grpc://127.0.0.1:10090;
        include /etc/nginx/snippets/grpc_headers.conf;
    }

    location /trojan-grpc {
        grpc_pass grpc://127.0.0.1:10091;
        include /etc/nginx/snippets/grpc_headers.conf;
    }


}
